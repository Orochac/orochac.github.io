# Site Configuration - Oscar Rochanakij's Personal Website
# Optimized for performance, responsiveness, and cross-browser compatibility

# Basic Site Settings
title: "Oscar Rochanakij | Mathematics, Computer Science & Travel"
email: o.rochanakij@protonmail.com
description: >-
  Personal portfolio and blog of Oscar Rochanakij - showcasing work in mathematics, 
  computer science, academic research, and travel adventures across Asia.
baseurl: ""
url: "https://orochac.github.io"
github_username: Orochac

# Build Settings
remote_theme: "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin: "default"

# Site Settings
locale: "en-AU"
title_separator: "|"
subtitle: "Mathematics • Computer Science • Travel"
name: "Oscar Rochanakij"
repository: "Orochac/orochac.github.io"
words_per_minute: 200
enable_copy_code_button: true

# Search
search: true
search_full_content: true
search_provider: lunr
lunr:
  search_within_pages: true

# SEO & Social
og_image: /assets/images/og-image.jpg
social:
  type: Person
  name: Oscar Rochanakij
  links:
    - "https://github.com/orochac"
    - "https://instagram.com/oscarrchkij"

# Site Author
author:
  name: "Oscar Rochanakij"
  avatar: "/assets/images/profile.jpg"
  bio: "Mathematics • Computer Science • Travel"
  location: "Melbourne, Australia"
  email: "o.rochanakij@protonmail.com"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/orochac"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://instagram.com/oscarrchkij"

# Site Footer
footer:
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:o.rochanakij@protonmail.com"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/orochac"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://instagram.com/oscarrchkij"

# Reading Files
include:
  - .htaccess
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - package.json
  - package-lock.json
  - Rakefile
  - README
  - tmp
  - /docs
  - /test
  - "*.md"
  - docs
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Sass/SCSS - Compressed for performance
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /blog-post/:categories/:title/
timezone: Australia/Melbourne

# Pagination
paginate: 10
paginate_path: /page:num/

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression for performance
compress_html:
  clippings: all
  comments: all
  endings: all
  startings: []
  blanklines: false
  profile: false
  ignore:
    envs: development

# Collections - Organized content types
collections:
  projects:
    output: true
    permalink: /portfolio/:name/
  industry_projects:
    output: true
    permalink: /portfolio/industry/:name/
  research:
    output: true
    permalink: /academic/research/:name/
  university_projects:
    output: true
    permalink: /academic/university/:name/
  independent_study:
    output: true
    permalink: /academic/independent/:name/
  travel_destinations:
    output: true
    permalink: /travel/destinations/:name/
  teaching:
    output: true
    permalink: /communication/teaching/:name/
  corporate_training:
    output: true
    permalink: /communication/corporate/:name/
  client_work:
    output: true
    permalink: /communication/clients/:name/

# Defaults - Optimized for different content types
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
      show_date: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false
  # _projects
  - scope:
      path: ""
      type: projects
    values:
      layout: single
      author_profile: false
      share: true
      related: true
  # _industry_projects
  - scope:
      path: ""
      type: industry_projects
    values:
      layout: single
      author_profile: false
      share: true
  # _research
  - scope:
      path: ""
      type: research
    values:
      layout: single
      author_profile: false
      share: true
  # _university_projects
  - scope:
      path: ""
      type: university_projects
    values:
      layout: single
      author_profile: false
      share: true
  # _independent_study
  - scope:
      path: ""
      type: independent_study
    values:
      layout: single
      author_profile: false
      share: true
  # _travel_destinations
  - scope:
      path: ""
      type: travel_destinations
    values:
      layout: single
      author_profile: false
      share: true
  # _teaching
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: false
      share: true
  # _corporate_training
  - scope:
      path: ""
      type: corporate_training
    values:
      layout: single
      author_profile: false
      share: true
  # _client_work
  - scope:
      path: ""
      type: client_work
    values:
      layout: single
      author_profile: false
      share: true

# Atom Feed
atom_feed:
  path: # blank (default) uses feed.xml
  hide: false

